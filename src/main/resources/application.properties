spring.application.name=IfCoders
server.address=0.0.0.0
spring.profiles.active=${PROFILES_ACTIVE}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
swagger.url=${SWAGGER_URL}

jwt.secret=${JWT_SECRET}
jwt.auth.expiration=3600000
jwt.email.expiration=1800000
jwt.reset.expiration=900000 

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_NAME}
spring.mail.password=${EMAIL_PASSWORD_APP}
link.confirme-token=${LINK_CONFIRME_TOKEN}
link.reset-token=${LINK_RESET_TOKEN}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
